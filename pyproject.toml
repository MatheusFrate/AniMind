[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "animind"
version = "0.1.0"
description = "AniMind Data Pipeline and Web Platform"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "elt_spark*", "extractors*", "orchestration*"]

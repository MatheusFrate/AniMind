name: "03 - PySpark Lakehouse & ALS ML Pipeline"

on:
  schedule:
    # Executa diariamente às 04:12 UTC
    - cron: '12 4 * * *'
  workflow_dispatch: # Permite disparo manual com 1 clique pelo GitHub

jobs:
  run-lakehouse-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Necessário para o PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar PySpark Lakehouse Flow
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPA_LAKE_ENDPOINT: ${{ secrets.SUPA_LAKE_ENDPOINT }}
          SUPA_LAKE_REGION: ${{ secrets.SUPA_LAKE_REGION }}
          SUPA_LAKE_ACCESS_KEY: ${{ secrets.SUPA_LAKE_ACCESS_KEY }}
          SUPA_LAKE_SECRET_KEY: ${{ secrets.SUPA_LAKE_SECRET_KEY }}
          SUPA_LAKE_BUCKET: ${{ secrets.SUPA_LAKE_BUCKET }}
        run: |
          python orchestration/animind_flow.py

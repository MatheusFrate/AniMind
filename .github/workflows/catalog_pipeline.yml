name: "02 - MAL Catalog & Relations Weekly Flow"

on:
  schedule:
    # Executa todo domingo às 03:12 UTC
    - cron: '12 3 * * 0'
  workflow_dispatch: # Permite disparo manual com 1 clique pelo GitHub

jobs:
  run-catalog-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Catalog Weekly Flow
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPA_LAKE_ENDPOINT: ${{ secrets.SUPA_LAKE_ENDPOINT }}
          SUPA_LAKE_REGION: ${{ secrets.SUPA_LAKE_REGION }}
          SUPA_LAKE_ACCESS_KEY: ${{ secrets.SUPA_LAKE_ACCESS_KEY }}
          SUPA_LAKE_SECRET_KEY: ${{ secrets.SUPA_LAKE_SECRET_KEY }}
          SUPA_LAKE_BUCKET: ${{ secrets.SUPA_LAKE_BUCKET }}
          CLIENT_ID: ${{ secrets.CLIENT_ID || secrets.MAL_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ANIMIND_API_URL: ${{ secrets.ANIMIND_API_URL }}
        run: |
          python orchestration/catalog_weekly_flow.py
